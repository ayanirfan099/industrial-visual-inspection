[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-visual-inspection"
version = "0.1.0"
description = "Unsupervised patch-level visual anomaly detection for industrial inspection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0", "scikit-learn>=1.3"]

[project.scripts]
visual-inspection = "inspection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
